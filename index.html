<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WPS Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="favicon-96.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
</head>
<body>
<title>WPS Staff Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#16324a">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: phone-first staff app. Bottom tab bar, one column of cards, wider two-column home on tablets. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --sunk:#f5f8fa; --ink:#16324a; --muted:#5b6f80; --line:#d3dde4;
  --accent:#1f6f8b; --accent-ink:#ffffff; --accent-soft:#dcecf2;
  --ok:#1d7a4e; --ok-soft:#dcf1e6; --warn:#9a5b00; --warn-soft:#fbecd3; --bad:#b4232c; --bad-soft:#fbe0e1;
  --w1:#1f6f8b; --w2:#e3a72f; --w3:#16324a; --w4:#4fa37a; --w5:#c8553d; --w6:#7c8fb3;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --r:14px; --plate:transparent; --plate-pad:0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1a24; --surface:#152634; --sunk:#112030; --ink:#e4edf3; --muted:#9db0bf; --line:#2a3f50;
  --accent:#5fb7d4; --accent-ink:#06202b; --accent-soft:#183c4c;
  --ok:#5fd19a; --ok-soft:#173a2a; --warn:#f0b357; --warn-soft:#3d2c12; --bad:#ff7d84; --bad-soft:#44191d;
  --w1:#2b86a6; --w2:#d79b25; --w3:#3b5b78; --w4:#3f9069; --w5:#c0573f; --w6:#6d80a6; --plate:#f8f4e6; --plate-pad:14px; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a24; --surface:#152634; --sunk:#112030; --ink:#e4edf3; --muted:#9db0bf; --line:#2a3f50;
  --accent:#5fb7d4; --accent-ink:#06202b; --accent-soft:#183c4c;
  --ok:#5fd19a; --ok-soft:#173a2a; --warn:#f0b357; --warn-soft:#3d2c12; --bad:#ff7d84; --bad-soft:#44191d;
  --w1:#2b86a6; --w2:#d79b25; --w3:#3b5b78; --w4:#3f9069; --w5:#c0573f; --w6:#6d80a6; --plate:#f8f4e6; --plate-pad:14px; color-scheme:dark}
*{box-sizing:border-box}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 104px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:22px} h2{font-size:18px} h3{font-size:16px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
a{color:var(--accent)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:14px} .num{font-variant-numeric:tabular-nums}
.stack{display:grid;gap:14px} .stack-s{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrapflex{flex-wrap:wrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 14px}
.top .sub{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--ink)}
.banner{border-radius:var(--r);padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.info{background:var(--accent-soft);color:var(--ink)} .banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner b{display:block}
.btn{border-radius:12px;padding:11px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);text-align:center}
.btn.block{width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--surface);color:var(--bad);border:1.5px solid var(--bad)}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700}
.chipbtn:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;font-size:14px;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:700}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.list>li:first-child{border-top:0}
.list .main{flex:1;min-width:0}
.list .main b{display:block;overflow-wrap:anywhere}
.list .main small{display:block;color:var(--muted);font-size:14px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--accent-soft);color:var(--ink);flex:none}
.avatar.photo{width:48px;height:48px;padding:0;overflow:hidden;cursor:zoom-in}
.avatar.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.photo-modal{position:fixed;inset:0;z-index:30;background:rgba(8,18,28,.72);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.photo-card{background:var(--surface);color:var(--ink);border-radius:var(--r);padding:18px;width:min(300px,100%);display:grid;gap:10px;justify-items:center;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.35)}
.photo-card img{width:100%;max-width:220px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:var(--sunk)}
.photo-card h2{font-size:22px}
.linkbtn{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.search{position:relative}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding-block:8px}
.grid2{display:grid;gap:14px}
@media (min-width:700px){.grid2{grid-template-columns:1fr 1fr}}
/* home */
.now{display:grid;gap:4px}
.now .big{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.1}
.timeline{list-style:none;margin:0;padding:0;display:grid}
.timeline li{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.timeline li:first-child{border-top:0}
.timeline li.cur{font-weight:700}
.timeline li.cur .tm{color:var(--accent)}
.timeline li.past{color:var(--muted)}
.tm{color:var(--muted);font-variant-numeric:tabular-nums}
/* timetables */
.tt{list-style:none;margin:0;padding:0;display:grid}
.tt li{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:9px 8px;border-top:1px solid var(--line);font-size:15px;align-items:start;border-radius:10px}
.tt li:first-child{border-top:0}
.tt .when{display:grid;line-height:1.25}
.tt .when b{font-size:13px;color:var(--ink)}
.tt .when span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tt .what{min-width:0;display:grid;gap:4px}
.tt .what>div{min-width:0}
.tt .what b{overflow-wrap:anywhere}
.tt .what small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.tt .what .free{color:var(--muted)}
.tt li.brk{background:var(--sunk);border-top-color:transparent;padding-block:6px}
.tt li.brk+li{border-top-color:transparent}
.tt li.brk .what{color:var(--muted);font-weight:700;font-size:14px}
.tt li.past{opacity:.6}
.tt li.now{background:var(--accent-soft);opacity:1;border-top-color:transparent;box-shadow:inset 3px 0 0 var(--accent)}
.tt li.now+li{border-top-color:transparent}
.tt .linkbtn{font-weight:600}
.tt-pick{display:grid;gap:10px}
.tt-pick select{width:100%}
/* duty */
.duty-block{display:grid;gap:6px}
.duty-row{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;background:var(--sunk);font-size:15px;flex-wrap:wrap}
.duty-row.mine{background:var(--accent-soft);font-weight:700}
.duty-row small{display:block;color:var(--muted);font-weight:400;font-size:13px}
/* attendance */
.expected{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.expected .big{font-family:var(--f-display);font-size:34px;font-weight:800}
.due{font-size:13px;color:var(--accent);font-weight:700}
.dial{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;gap:8px;margin-block:6px}
.step{height:72px;border-radius:50%;border:2px solid var(--line);font-family:var(--f-display);font-size:34px;font-weight:800;background:var(--surface)}
.step:active{transform:scale(.96)}
.count{text-align:center}
.count .n{font-family:var(--f-display);font-size:88px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.count .of{color:var(--muted);font-size:15px}
.count.diff .n{color:var(--bad)}
.go{width:100%;border-radius:var(--r);padding:18px;font-size:20px;font-weight:700;background:var(--ok);color:var(--surface)}
.go.diff{background:var(--bad)} .go.sa{background:var(--accent);color:var(--accent-ink)}
.disc{border:2px solid var(--bad);background:var(--bad-soft)}
.disc h2{color:var(--bad)}
.disc ol{margin:8px 0 0;padding-left:20px;display:grid;gap:12px}
.disc li::marker{font-weight:700;color:var(--bad)}
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.reason{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;font-size:14px}
.reason small{display:block;color:var(--muted);font-size:12px}
.alarm{background:var(--bad);color:var(--surface);border-radius:var(--r);padding:16px}
.alarm h2{color:var(--surface);font-size:22px}
.alarm ul{margin:8px 0 12px;padding-left:20px}
.alarm .btn{background:var(--surface);color:var(--ink)}
.log{list-style:none;margin:0;padding:0;display:grid}
.log li{display:grid;grid-template-columns:64px 40px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.log li:first-child{border-top:0}
.log .t{color:var(--muted)} .log .c{font-weight:700;font-size:18px}
.log .p{min-width:0} .log .p small{display:block;color:var(--muted);font-size:13px}
.x{color:var(--muted);padding:6px 8px;border-radius:8px;font-size:13px}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.board{display:grid;gap:8px}
.board .cls{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px;border-radius:12px;background:var(--sunk);border-left:5px solid var(--line)}
.board .cls.ok{border-left-color:var(--ok)} .board .cls.warn{border-left-color:var(--warn)} .board .cls.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.board .cls small{color:var(--muted);font-size:13px;grid-column:1/-1}
/* weekly sheet */
.sheetwrap{overflow-x:auto}
.sheet{background:#fff;color:#111;border:1px solid #999;padding:18px;min-width:640px;font-size:12px}
.sheet h2{font-size:17px;text-align:center;margin-bottom:8px;color:#111}
.sheet .hdr{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.sheet .hdr span{border-bottom:1px solid #111;padding:0 6px;min-width:120px;display:inline-block;font-weight:700}
.sheet .inst{font-size:10.5px;margin:0 0 8px;color:#222}
.sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
.sheet th,.sheet td{border:1px solid #555;padding:3px 4px;text-align:center;font-variant-numeric:tabular-nums}
.sheet th{background:#eee;font-weight:700}
.sheet td.flag{color:#b4232c;font-weight:700}
.sheet .notes{border:1px solid #555;min-height:60px;padding:6px;margin-top:8px;text-align:left}
.sheet .notes ul{margin:4px 0 0;padding-left:16px}
.sheet .pts{font-size:10.5px;margin-top:8px}
.sheet .pts ul{margin:2px 0 0;padding-left:16px}
.sheet .rcv{margin-top:10px}
/* tools */
.knight{--gold:#c5a059;background:#1a2a44 radial-gradient(circle at center,#2c3e50 0%,#1a2a44 100%);color:#fff;border-radius:var(--r);padding:20px 16px 18px;font-family:Georgia,"Times New Roman",serif;display:grid;gap:16px;overflow:hidden}
.k-head{text-align:center;display:grid;justify-items:center;gap:6px}
.k-head img{width:96px;height:96px;border-radius:24px;border:4px solid rgba(197,160,89,.5);box-shadow:0 10px 25px rgba(0,0,0,.5);object-fit:cover}
.k-head h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(22px,7vw,28px);font-weight:900;text-transform:uppercase;font-style:italic;text-shadow:0 2px 4px rgba(0,0,0,.5);color:#fff}
.k-rule{height:4px;width:96px;background:linear-gradient(to right,transparent,var(--gold),transparent)}
.k-sub{color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:.3em;font-weight:700}
.k-card{background:rgba(255,255,255,.05);border:1px solid rgba(197,160,89,.3);border-radius:1.5rem;padding:18px;display:grid;gap:14px}
.k-label{display:block;font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.15em;margin-bottom:8px}
.knight select,.knight textarea{background:rgba(0,0,0,.3);border:1px solid rgba(197,160,89,.3);border-radius:12px;color:#fff;font-weight:700;padding:12px;font-family:inherit}
.knight select option{color:#111;background:#fff}
.k-switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;color:#d1d5db;cursor:pointer}
.k-switch input{position:absolute;opacity:0;width:1px;height:1px}
.k-track{position:relative;width:44px;height:24px;border-radius:999px;background:#374151;flex:none;transition:background .15s}
.k-track::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.k-switch input:checked+.k-track{background:var(--gold)}
.k-switch input:checked+.k-track::after{transform:translateX(20px)}
.k-switch input:focus-visible+.k-track{outline:3px solid var(--gold);outline-offset:2px}
.k-wheel{position:relative;width:min(380px,85vw);max-width:100%;aspect-ratio:1;margin:8px auto 0;filter:drop-shadow(0 0 20px rgba(0,0,0,.5))}
.k-wheel canvas{width:100%;height:100%;display:block;border-radius:50%;border:8px solid var(--gold)}
.k-pointer{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:30px solid var(--gold);z-index:3;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.k-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:24%;aspect-ratio:1;background:#fff;border-radius:50%;border:4px solid var(--gold);box-shadow:0 0 15px rgba(197,160,89,.6);overflow:hidden;z-index:2}
.k-hub img{width:100%;height:100%;object-fit:cover;display:block}
.k-result{min-height:80px;display:grid;place-items:center;text-align:center}
.k-result h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,9vw,40px);font-weight:900;text-transform:uppercase;font-style:italic;letter-spacing:-.03em;text-shadow:0 0 15px rgba(197,160,89,.8);color:#fff;overflow-wrap:anywhere;transition:opacity .2s}
.k-pulse{animation:kpulse .5s ease-in-out infinite}
@keyframes kpulse{50%{transform:scale(1.1);filter:brightness(1.3)}}
.k-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.k-gold{background:linear-gradient(135deg,#d4af37 0%,#c5a059 100%);color:#1a2a44;text-shadow:0 1px 0 rgba(255,255,255,.3);box-shadow:0 4px 0 #8e7035;font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:900;letter-spacing:.1em;padding:20px 8px;border-radius:16px}
.k-gold:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #8e7035}
.k-gold:disabled{background:#4b5563;box-shadow:none;color:#9ca3af;opacity:1}
.k-ghost{background:rgba(255,255,255,.1);color:var(--gold);border:1px solid rgba(197,160,89,.3);font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:.05em;padding:20px 8px;border-radius:16px}
.k-ghost:active{background:rgba(255,255,255,.2)}
.knight button:focus-visible,.knight select:focus-visible,.knight textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.k-seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid rgba(197,160,89,.3)}
.k-seg button{flex:1;padding:9px 4px;border-radius:9px;color:#d1d5db;font-family:inherit;font-weight:700;font-size:14px}
.k-seg button[aria-pressed="true"]{background:linear-gradient(135deg,#d4af37 0%,#c5a059 100%);color:#1a2a44}
.k-seg button:disabled{opacity:.6}
.confetti-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.k-count{text-align:center;color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.2em;opacity:.7}
.timerface{position:relative;width:min(300px,100%);aspect-ratio:1;margin:0 auto;max-width:100%}
.timerface svg{width:100%;height:100%;transform:rotate(-90deg)}
.timerface .digits{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:64px;font-variant-numeric:tabular-nums}
.timerface.done .digits{color:var(--bad)}
.groups{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.group{background:var(--sunk);border-radius:12px;padding:12px;border-top:4px solid var(--w1)}
.group ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px;font-size:15px}
.namepick{display:flex;flex-wrap:wrap;gap:6px}
.namepick button{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.namepick button[aria-pressed="false"]{text-decoration:line-through;color:var(--muted);background:var(--sunk)}
/* sign-in */
.signin{min-height:70vh;display:grid;place-items:center;text-align:center}
.signin .mark{width:min(240px,70vw);margin:0 auto 4px;background:var(--plate);border-radius:24px;padding:var(--plate-pad)}
.signin .mark img{display:block;width:100%;height:auto}
.crest-sm{display:inline-block;width:34px;height:34px;vertical-align:-7px;margin-right:8px}
.crest-sm img{display:block;width:100%;height:100%}
/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabs button{flex:1;min-width:0;max-width:140px;padding:8px 1px 10px;font-weight:700;font-size:12px;letter-spacing:-.01em;color:var(--muted);display:grid;justify-items:center;gap:2px;border-top:3px solid transparent}
.tabs button svg{width:22px;height:22px}
.tabs.many button{font-size:11px}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.sw:first-of-type{border-top:0}
.sw b{display:block} .sw small{display:block;color:var(--muted);font-size:14px}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .track{position:relative;width:48px;height:28px;border-radius:999px;background:var(--line);flex:none;transition:background .15s}
.sw .track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+.track{background:var(--ok)}
.sw input:checked+.track::after{transform:translateX(20px)}
.sw input:focus-visible+.track{outline:3px solid var(--accent);outline-offset:2px}
.sw input:disabled+.track{opacity:.5}
.form-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.form-grid .full{grid-column:1/-1}
@media (max-width:420px){.form-grid{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;display:flex;gap:14px;align-items:center;z-index:6;max-width:calc(100% - 32px)}
.toast button{text-decoration:underline;color:inherit}
@media (max-width:380px){.reasons{grid-template-columns:1fr}.count .n{font-size:72px}.dial{grid-template-columns:60px 1fr 60px}.step{height:60px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.knight .k-pulse{animation:kpulse .5s ease-in-out infinite!important}}
@media print{
  body{background:#fff}.tabs,.toast,.noprint{display:none!important}
  .wrap{max-width:none;padding:0}.sheetwrap{overflow:visible}.sheet{border:0;min-width:0;padding:0}
  @page{size:letter landscape;margin:12mm}
}

    students: (raw.students || []).map(r => ({ first: g(r, 'First Name'), last: g(r, 'Last Name'), grade: g(r, 'Grade'), homeroom: g(r, 'Homeroom'), photo: g(r, 'Photo Key') })).filter(s => s.first || s.last),
    bells: (raw.bells || []).map(r => ({ start: g(r, 'Start'), end: g(r, 'End'), label: g(r, 'Label'), checkpoint: g(r, 'Attendance Checkpoint') })).filter(b => toMins(b.start) != null).sort((a, b) => toMins(a.start) - toMins(b.start)),
    duty: (raw.duty || []).map(r => ({ day: g(r, 'Day'), block: g(r, 'Time Block'), start: g(r, 'Start'), end: g(r, 'End'), location: g(r, 'Location'), staff: g(r, 'Staff'), indoor: g(r, 'Indoor Plan'), dnote: g(r, 'Note') })).filter(x => x.location || x.staff),
    noSchool: (raw.noSchool || []).map(r => { const a = g(r, 'Start Date').slice(0, 10); return { start: a, end: (g(r, 'End Date') || a).slice(0, 10), reason: g(r, 'Reason') }; }).filter(x => parseDate(x.start)),
    cycle: { n: parseInt((raw.settings || {})['Cycle Days'], 10) || 0, anchor: parseDate((raw.settings || {})['Cycle Anchor Date']), day: parseInt((raw.settings || {})['Cycle Anchor Day'], 10) || 1 },
    dutyChanges: (raw.dutyChanges || []).map(r => ({ date: g(r, 'Date').slice(0, 10), block: g(r, 'Time Block'), location: g(r, 'Location'), coveredBy: g(r, 'Covered By'), replacing: g(r, 'Replacing'), note: g(r, 'Note') })),
    schedules: (raw.schedules || []).map(r => ({ homeroom: g(r, 'Homeroom'), day: g(r, 'Day'), start: g(r, 'Start'), end: g(r, 'End'), subject: g(r, 'Subject'), teacher: g(r, 'Teacher'), room: g(r, 'Room') })).filter(x => x.homeroom)
  };
  Object.keys(cycleCache).forEach(k => delete cycleCache[k]);
  d.students.sort((a, b) => natural(a.last + a.first, b.last + b.first));

/* "Adams", "S. Wright", "Ms. Kaur" or an email in a schedule cell all match the right person */
const TITLE = /^(mr|mrs|ms|mx|mme|m|dr)\.?\s+/i;
function isPerson(cell, person) {
  if (!cell || !person) return false;
  const full = String(person.name || '').toLowerCase().trim(), name = full.replace(TITLE, '');
  const words = name.split(/\s+/).filter(Boolean), last = words[words.length - 1] || '', firstI = words.length > 1 ? words[0][0] : '';
  const email = String(person.email || '').toLowerCase(), local = email.split('@')[0];
  return String(cell).split(/,|;|&|\band\b/i).some(raw => {
    const p = raw.trim().toLowerCase(); if (!p) return false;
    if (p === email || p === local || p === full || p === name) return true;
    const q = p.replace(TITLE, ''), m = q.match(/^([a-z])\.?\s+([a-z'’-]+)$/);
    if (m) return m[2] === last && (!firstI || m[1] === firstI);
    return words.length > 1 && q === last;
  });
}

async function api(action, params) {
  const q = new URLSearchParams(Object.assign({ action, session }, params || {}));
  const res = await fetch(CONFIG.SCRIPT_URL + '?' + q.toString(), { cache: 'no-store' });
  const data = await res.json();
  if (data && data.error === 'session') { signOut('Your sign-in expired. Please sign in again.'); throw new Error('session'); }
  if (data && data.error) throw new Error(data.error);
  return data;
}
async function apiPost(body) {
  const res = await fetch(CONFIG.SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ session }, body)) });
  const data = await res.json();
  if (data && data.error === 'session') { signOut('Your sign-in expired. Please sign in again.'); throw new Error('session'); }
  if (data && data.error) throw new Error(data.error);
  return data;
}
async function loadData(quiet) {
  if (DEMO) { demoRaw = demoData(ui.role); D = normalize(demoRaw); seedDemoChecks(); if (isOffice()) ui.checkView = 'board'; render(); return; }
  const cached = LS.get(K.data, null);
  if (cached && !D) D = normalize(cached);
  if (!quiet && !D) { ui.loading = true; render(); }
  try {
    const raw = await api('all');
    LS.set(K.data, raw); D = normalize(raw);
  } catch (e) {
    if (e.message !== 'session' && !D) ui.authError = 'Could not load the staff data. Check your connection and try again.';
    if (e.message !== 'session' && D) toast('Offline – showing the last saved data');
  }
  ui.loading = false;
  if (D && isOffice() && !ui._boardDefault) { ui._boardDefault = true; ui.checkView = 'board'; }
  render(); flush();
}
function loadGis() {
  return new Promise((resolve, reject) => {
    if (window.google && google.accounts && google.accounts.oauth2) return resolve();
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => resolve(); s.onerror = () => reject(new Error('gis')); document.head.appendChild(s);
  });
}
async function signIn() {
  ui.authError = ''; ui.loading = true; render();
  try {
    await loadGis();
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.GOOGLE_CLIENT_ID, scope: 'openid email profile',
      callback: async (resp) => {
        if (resp.error) { ui.loading = false; ui.authError = 'Sign-in was cancelled.'; render(); return; }
        try {
          const q = new URLSearchParams({ action: 'login', token: resp.access_token });
          const r = await fetch(CONFIG.SCRIPT_URL + '?' + q.toString(), { cache: 'no-store' });
          const data = await r.json();
          if (data.error) throw new Error(data.error);
          session = data.session; LS.set(K.session, session);
          await loadData();
        } catch (e) { ui.loading = false; ui.authError = e.message === 'not_staff' ? 'That account isn\'t on the staff list. Ask the office to add you, or sign in with your board account.' : 'Sign-in failed. Please try again.'; render(); }
      }
    });
    client.requestAccessToken();
  } catch (e) { ui.loading = false; ui.authError = 'Google sign-in could not load. Check your connection.'; render(); }
}
function signOut(msg) {
  session = null; D = null; photoCache = {}; closePhoto(); LS.del(K.session); LS.del(K.data);
  ui.authError = msg || ''; ui.tab = 'home'; render();
}

/* ---------- attendance sync ---------- */
function queue(op) { outbox.push(op); LS.set(K.outbox, outbox); flush(); }
async function flush() {
  if (DEMO) { outbox = []; LS.set(K.outbox, outbox); return; }
  if (!outbox.length || ui.syncing || !session || navigator.onLine === false) return;
  ui.syncing = true; const batch = outbox.slice(0, 50);
  try {
    await apiPost({ action: 'attendance', entries: batch });
    const sent = new Set(batch.map(b => b.op + b.id));
    outbox = outbox.filter(o => !sent.has(o.op + o.id)); LS.set(K.outbox, outbox);
  } catch (e) { /* stays queued */ }
  ui.syncing = false;
  if (ui.tab === 'check') { const el = document.getElementById('syncstate'); if (el) el.outerHTML = syncPill(); }
  if (outbox.length && !ui.syncing) setTimeout(flush, 20000);
}

   ====================================================================== */
function dayRec(hr, dk) { const k = (dk || dkey(new Date())) + '|' + hr; return A.days[k] || (A.days[k] = { expected: null, entries: [] }); }
const enrolled = hr => roster(hr).length;
const expectedFor = hr => { const d = dayRec(hr); return d.expected == null ? enrolled(hr) : d.expected; };
function addEntry(hr, e) {
  const d = dayRec(hr);
  e.id = uid(); e.date = dkey(new Date()); e.homeroom = hr; e.t = e.t || hhmm(new Date());
  if (e.expected == null) e.expected = expectedFor(hr);
  d.entries.push(e); saveAtt();
  queue({ op: 'add', id: e.id, date: e.date, time: e.t, homeroom: hr, checkpoint: e.point, count: e.count, expected: e.expected, status: e.status, note: e.note || '' });
  return e;
}
function removeEntry(hr, id) {
  const d = dayRec(hr); const i = d.entries.findIndex(e => e.id === id);
  if (i < 0) return;
  const e = d.entries[i]; d.entries.splice(i, 1);
  if (e.prevExpected !== undefined) d.expected = e.prevExpected;
  saveAtt(); queue({ op: 'delete', id });
}
function seedDemoChecks() {
  if (ui.role === 'Admin') return;
  const hr = myHomeroom(); const d = dayRec(hr); if (d.entries.length) return;
  const n = nowMins(); if (isWeekend() || n < 8 * 60 + 50) return;
  const en = enrolled(hr);
  d.entries.push({ id: uid(), t: '08:47', count: en - 1, point: SA_AM, status: 'safe', expected: en, note: '1 absent at Safe Arrival', prevExpected: null });
  d.expected = en - 1;
  if (n > 11 * 60 + 12) d.entries.push({ id: uid(), t: '11:12', count: en - 1, point: 'After recess / break', status: 'ok', expected: en - 1 });
  saveAtt();
}
function suggestion(hr) {
  const n = nowMins(); const d = dayRec(hr); let best = null;
  (D.bells || []).filter(b => b.checkpoint).forEach(b => {
    const bm = toMins(b.start);
    if (n >= bm - 10 && n <= bm + 25) {
      const done = d.entries.some(e => { const em = toMins(e.t); return e.point === b.checkpoint && em >= bm - 10 && em <= bm + 25; });
      if (!done && (!best || Math.abs(n - bm) < Math.abs(n - best.m))) best = { m: bm, t: b.start, p: b.checkpoint, label: b.label };
    }
  });
  return best;
}
function lastCheck(hr) {
  const e = dayRec(hr).entries.filter(x => x.status !== 'adjust');
  return e.length ? e[e.length - 1] : null;
}

function applyOpsLocal(raw, ops) {
  ops.forEach(op => {
    if (op.type === 'setting') raw.settings[op.key] = String(op.value);
    if (op.type === 'addNoSchool') (raw.noSchool = raw.noSchool || []).push({ 'Start Date': op.start, 'End Date': op.end || '', Reason: op.reason || 'No school' });
    if (op.type === 'removeNoSchool') raw.noSchool = (raw.noSchool || []).filter(r => !(r['Start Date'] === op.start && String(r.Reason) === String(op.reason || '')));
    if (op.type === 'addDutyChange') raw.dutyChanges.push({ Date: op.date, 'Time Block': op.block || '', Location: op.location, 'Covered By': op.coveredBy, Replacing: op.replacing || '', Note: op.note || '' });

  });
}

  if (k === 'setting') { const key = e.target.dataset.key, on = e.target.checked; adminOps([{ type: 'setting', key, value: on ? 'TRUE' : 'FALSE' }], ({ 'Show Attendance': 'Attendance checks ', 'Allow Board Guests': 'Guest sign-in ', 'Guest Photos': 'Guest photos ' }[key] || 'Setting ') + (on ? 'turned on' : 'turned off')); }
  if (k === 'dcDate') { ui.dc.date = e.target.value; ui.dc.slot = ''; render(); }
  if (k === 'dcSlot') { ui.dc.slot = e.target.value; render(); }
  if (k === 'ttSel') { ui.ttSel = e.target.value; ui.ttScroll = true; render(); }
  if (k === 'dutyMine') { prefs.dutyMine = e.target.checked; savePrefs(); render(); }
  if (k === 'toolSrc') { prefs.toolSrc = e.target.value; savePrefs(); pendingBanish = null; ui.wheelOut = []; ui.winner = null; wheelDeg = 0; ui.groups = null; ui.absent = {}; render(); }
  if (k === 'banish') { prefs.banish = e.target.checked; savePrefs(); }
});
app.addEventListener('input', e => {
  const k = e.target.dataset.input; if (!k) return;
  if (k === 'q') { ui.q = e.target.value; const r = document.getElementById('results'); if (r) { r.innerHTML = lookupResults(); clearTimeout(ui._ph); ui._ph = setTimeout(hydratePhotos, 250); } }
  if (k === 'dcCovered') ui.dc.covered = e.target.value;
  if (k === 'dcNote') ui.dc.note = e.target.value;
  if (k === 'ndStart') ui.nd.start = e.target.value;
  if (k === 'ndEnd') ui.nd.end = e.target.value;
  if (k === 'ndReason') ui.nd.reason = e.target.value;
  if (k === 'custom') { prefs.custom = e.target.value; savePrefs(); ui.wheelOut = []; ui.groups = null; if (ui.tool === 'wheel') { drawWheel(); const k = document.querySelector('.k-count'); if (k) k.textContent = wheelNames().length + ' KNIGHTS REMAINING'; } }
});
app.addEventListener('focusout', e => { if (e.target.dataset.input === 'custom') render(); });

/* keep "now" markers, due checks and the office board fresh */
setInterval(() => {
  if (spinning || timer.running) return;
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  if (ui.disc || ui.alarm) return;
  if (ui.tab === 'home' || ui.tab === 'duty' || (ui.tab === 'check' && ui.checkView !== 'week')) render();
}, 60000);
/* prune attendance kept on this device after 10 weeks */
(() => { const cut = new Date(); cut.setDate(cut.getDate() - 70); const ck = dkey(cut); Object.keys(A.days).forEach(k => { if (k.slice(0, 10) < ck) delete A.days[k]; }); saveAtt(); })();
/* installed app: passthrough service worker, same as the DIAC Hub */
try { if (!FRAMED && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}

if (DEMO || session) loadData(); else render();
})();
