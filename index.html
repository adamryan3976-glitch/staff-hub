<style>
/* Layout: phone-first staff app. Bottom tab bar, one column of cards, wider two-column home on tablets. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --sunk:#f5f8fa; --ink:#16324a; --muted:#5b6f80; --line:#d3dde4;
  --accent:#1f6f8b; --accent-ink:#ffffff; --accent-soft:#dcecf2;
  --ok:#1d7a4e; --ok-soft:#dcf1e6; --warn:#9a5b00; --warn-soft:#fbecd3; --bad:#b4232c; --bad-soft:#fbe0e1;
  --w1:#1f6f8b; --w2:#e3a72f; --w3:#16324a; --w4:#4fa37a; --w5:#c8553d; --w6:#7c8fb3;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1a24; --surface:#152634; --sunk:#112030; --ink:#e4edf3; --muted:#9db0bf; --line:#2a3f50;
  --accent:#5fb7d4; --accent-ink:#06202b; --accent-soft:#183c4c;
  --ok:#5fd19a; --ok-soft:#173a2a; --warn:#f0b357; --warn-soft:#3d2c12; --bad:#ff7d84; --bad-soft:#44191d;
  --w1:#2b86a6; --w2:#d79b25; --w3:#3b5b78; --w4:#3f9069; --w5:#c0573f; --w6:#6d80a6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a24; --surface:#152634; --sunk:#112030; --ink:#e4edf3; --muted:#9db0bf; --line:#2a3f50;
  --accent:#5fb7d4; --accent-ink:#06202b; --accent-soft:#183c4c;
  --ok:#5fd19a; --ok-soft:#173a2a; --warn:#f0b357; --warn-soft:#3d2c12; --bad:#ff7d84; --bad-soft:#44191d;
  --w1:#2b86a6; --w2:#d79b25; --w3:#3b5b78; --w4:#3f9069; --w5:#c0573f; --w6:#6d80a6; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 104px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:22px} h2{font-size:18px} h3{font-size:16px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
a{color:var(--accent)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:14px} .num{font-variant-numeric:tabular-nums}
.stack{display:grid;gap:14px} .stack-s{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrapflex{flex-wrap:wrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 14px}
.top .sub{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--ink)}
.banner{border-radius:var(--r);padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.info{background:var(--accent-soft);color:var(--ink)} .banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner b{display:block}
.btn{border-radius:12px;padding:11px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);text-align:center}
.btn.block{width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--surface);color:var(--bad);border:1.5px solid var(--bad)}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700}
.chipbtn:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;font-size:14px;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:700}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.list>li:first-child{border-top:0}
.list .main{flex:1;min-width:0}
.list .main b{display:block;overflow-wrap:anywhere}
.list .main small{display:block;color:var(--muted);font-size:14px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--accent-soft);color:var(--ink);flex:none}
.linkbtn{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.search{position:relative}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding-block:8px}
.grid2{display:grid;gap:14px}
@media (min-width:700px){.grid2{grid-template-columns:1fr 1fr}}
/* home */
.now{display:grid;gap:4px}
.now .big{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.1}
.timeline{list-style:none;margin:0;padding:0;display:grid}
.timeline li{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.timeline li:first-child{border-top:0}
.timeline li.cur{font-weight:700}
.timeline li.cur .tm{color:var(--accent)}
.timeline li.past{color:var(--muted)}
.tm{color:var(--muted);font-variant-numeric:tabular-nums}
/* duty */
.duty-block{display:grid;gap:6px}
.duty-row{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;background:var(--sunk);font-size:15px;flex-wrap:wrap}
.duty-row.mine{background:var(--accent-soft);font-weight:700}
.duty-row small{display:block;color:var(--muted);font-weight:400;font-size:13px}
/* attendance */
.expected{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.expected .big{font-family:var(--f-display);font-size:34px;font-weight:800}
.due{font-size:13px;color:var(--accent);font-weight:700}
.dial{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;gap:8px;margin-block:6px}
.step{height:72px;border-radius:50%;border:2px solid var(--line);font-family:var(--f-display);font-size:34px;font-weight:800;background:var(--surface)}
.step:active{transform:scale(.96)}
.count{text-align:center}
.count .n{font-family:var(--f-display);font-size:88px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.count .of{color:var(--muted);font-size:15px}
.count.diff .n{color:var(--bad)}
.go{width:100%;border-radius:var(--r);padding:18px;font-size:20px;font-weight:700;background:var(--ok);color:var(--surface)}
.go.diff{background:var(--bad)} .go.sa{background:var(--accent);color:var(--accent-ink)}
.disc{border:2px solid var(--bad);background:var(--bad-soft)}
.disc h2{color:var(--bad)}
.disc ol{margin:8px 0 0;padding-left:20px;display:grid;gap:12px}
.disc li::marker{font-weight:700;color:var(--bad)}
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.reason{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;font-size:14px}
.reason small{display:block;color:var(--muted);font-size:12px}
.alarm{background:var(--bad);color:var(--surface);border-radius:var(--r);padding:16px}
.alarm h2{color:var(--surface);font-size:22px}
.alarm ul{margin:8px 0 12px;padding-left:20px}
.alarm .btn{background:var(--surface);color:var(--ink)}
.log{list-style:none;margin:0;padding:0;display:grid}
.log li{display:grid;grid-template-columns:64px 40px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.log li:first-child{border-top:0}
.log .t{color:var(--muted)} .log .c{font-weight:700;font-size:18px}
.log .p{min-width:0} .log .p small{display:block;color:var(--muted);font-size:13px}
.x{color:var(--muted);padding:6px 8px;border-radius:8px;font-size:13px}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.board{display:grid;gap:8px}
.board .cls{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px;border-radius:12px;background:var(--sunk);border-left:5px solid var(--line)}
.board .cls.ok{border-left-color:var(--ok)} .board .cls.warn{border-left-color:var(--warn)} .board .cls.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.board .cls small{color:var(--muted);font-size:13px;grid-column:1/-1}
/* weekly sheet */
.sheetwrap{overflow-x:auto}
.sheet{background:#fff;color:#111;border:1px solid #999;padding:18px;min-width:640px;font-size:12px}
.sheet h2{font-size:17px;text-align:center;margin-bottom:8px;color:#111}
.sheet .hdr{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.sheet .hdr span{border-bottom:1px solid #111;padding:0 6px;min-width:120px;display:inline-block;font-weight:700}
.sheet .inst{font-size:10.5px;margin:0 0 8px;color:#222}
.sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
.sheet th,.sheet td{border:1px solid #555;padding:3px 4px;text-align:center;font-variant-numeric:tabular-nums}
.sheet th{background:#eee;font-weight:700}
.sheet td.flag{color:#b4232c;font-weight:700}
.sheet .notes{border:1px solid #555;min-height:60px;padding:6px;margin-top:8px;text-align:left}
.sheet .notes ul{margin:4px 0 0;padding-left:16px}
.sheet .pts{font-size:10.5px;margin-top:8px}
.sheet .pts ul{margin:2px 0 0;padding-left:16px}
.sheet .rcv{margin-top:10px}
/* tools */
.wheelbox{position:relative;width:min(340px,100%);margin:0 auto;aspect-ratio:1;max-width:100%}
.wheelbox canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--ink);filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.winner{text-align:center;padding:14px;border-radius:var(--r);background:var(--accent-soft)}
.winner .name{font-family:var(--f-display);font-size:32px;font-weight:800}
.timerface{position:relative;width:min(300px,100%);aspect-ratio:1;margin:0 auto;max-width:100%}
.timerface svg{width:100%;height:100%;transform:rotate(-90deg)}
.timerface .digits{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:64px;font-variant-numeric:tabular-nums}
.timerface.done .digits{color:var(--bad)}
.groups{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.group{background:var(--sunk);border-radius:12px;padding:12px;border-top:4px solid var(--w1)}
.group ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px;font-size:15px}
.namepick{display:flex;flex-wrap:wrap;gap:6px}
.namepick button{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.namepick button[aria-pressed="false"]{text-decoration:line-through;color:var(--muted);background:var(--sunk)}
/* sign-in */
.signin{min-height:70vh;display:grid;place-items:center;text-align:center}
.signin .mark{width:84px;height:84px;margin:0 auto 14px}
/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabs button{flex:1;max-width:140px;padding:8px 2px 10px;font-weight:700;font-size:12px;color:var(--muted);display:grid;justify-items:center;gap:2px;border-top:3px solid transparent}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;display:flex;gap:14px;align-items:center;z-index:6;max-width:calc(100% - 32px)}
.toast button{text-decoration:underline;color:inherit}
@media (max-width:380px){.reasons{grid-template-columns:1fr}.count .n{font-size:72px}.dial{grid-template-columns:60px 1fr 60px}.step{height:60px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff}.tabs,.toast,.noprint{display:none!important}
  .wrap{max-width:none;padding:0}.sheetwrap{overflow:visible}.sheet{border:0;min-width:0;padding:0}
  @page{size:letter landscape;margin:12mm}
}
</style>

<script>
(() => {

/* ======================================================================

   ====================================================================== */
const CONFIG = {
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbzU1SW3P3PlGCMusQ8E8Ou5YvmARWCCjt7T4aFRxBF_eMfO3womzs4W6_fS-AhF-ZTL/exec',        // Apps Script web app URL, ends in /exec

};

const FRAMED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const DEMO = !CONFIG.SCRIPT_URL || FRAMED;

/* ---------- storage ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const K = {
  session: 'wps-hub-session', data: 'wps-hub-data', att: DEMO ? 'wps-hub-att-demo' : 'wps-hub-att',
  outbox: 'wps-hub-outbox', prefs: 'wps-hub-prefs', demoRole: 'wps-hub-demo-role'
};

/* ---------- helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => (n < 10 ? '0' : '') + n;
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hhmm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const toMins = t => { if (!t) return null; const m = String(t).match(/(\d{1,2}):(\d{2})\s*([ap])?/i); if (!m) return null; let h = +m[1]; if (m[3]) { const pm = /p/i.test(m[3]); if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0; } return h * 60 + (+m[2]); };
const nowMins = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
const nice = t => { const m = toMins(t); if (m == null) return ''; let h = Math.floor(m / 60); const mm = pad(m % 60); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + ':' + mm + ' ' + ap; };
const DOW = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const longDate = d => DAYS[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate();
const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const natural = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });
const initials = n => String(n || '?').replace(/^(Mr|Mrs|Ms|Mx|Mme|M|Dr)\.?\s+/i, '').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const isWeekend = () => { const d = new Date().getDay(); return d === 0 || d === 6; };
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const parseDate = s => { const m = String(s || '').match(/(\d{4})-(\d{1,2})-(\d{1,2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
/* ---------- school days and the Day 1–5 cycle ---------- */
function noSchoolReason(d) {
  if (d.getDay() === 0 || d.getDay() === 6) return 'Weekend';
  const k = dkey(d); const x = D && D.noSchool.find(r => k >= r.start && k <= r.end);
  return x ? (x.reason || 'No school') : '';
}
const isSchoolDay = d => !noSchoolReason(d);
const useCycle = () => !!(D && D.cycle.n && D.cycle.anchor);
const cycleCache = {};
function cycleDay(d) {
  if (!useCycle() || !isSchoolDay(d)) return null;
  const k = dkey(d); if (cycleCache[k] !== undefined) return cycleCache[k];
  const c = D.cycle, a = new Date(c.anchor), t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dir = t >= a ? 1 : -1; let n = 0, guard = 0;
  while (dkey(a) !== k && guard++ < 800) { a.setDate(a.getDate() + dir); if (isSchoolDay(a)) n += dir; }
  return (cycleCache[k] = ((c.day - 1 + n) % c.n + c.n) % c.n + 1);
}
function nextSchoolDay(from) { const d = new Date(from); for (let i = 0; i < 40; i++) { if (isSchoolDay(d)) return d; d.setDate(d.getDate() + 1); } return new Date(from); }
const dayName = d => DAYS[d.getDay()] + (cycleDay(d) ? ' (Day ' + cycleDay(d) + ')' : '');
/* the days a schedule can be viewed by: Day 1..N in cycle mode, otherwise Mon–Fri of this (or next) week */
function dayOptions() {
  const base = nextSchoolDay(today0());
  if (useCycle()) {
    const opts = [], d = new Date(base);
    for (let i = 0; i < 90 && opts.length < D.cycle.n; i++) {
      const c = cycleDay(d); if (c && !opts.some(o => o.n === c)) opts.push({ key: 'c' + c, n: c, label: 'Day ' + c, date: new Date(d) });
      d.setDate(d.getDate() + 1);
    }
    return opts.sort((a, b) => a.n - b.n);
  }
  const mon = monday(base);
  return DOW.map((x, i) => { const dt = new Date(mon); dt.setDate(mon.getDate() + i); return { key: 'w' + i, label: x.slice(0, 3), date: dt }; });

function pickDay(key) { const o = dayOptions(); const b = dkey(nextSchoolDay(today0())); return o.find(x => x.key === key) || o.find(x => dkey(x.date) === b) || o[0]; }
const dayMatches = (cell, date) => {
  const s = String(cell || '').toLowerCase().trim();
  if (!s || /every|daily|^all|mon\s*[-–]\s*fri/.test(s)) return true;

const TITLE = /^(mr|mrs|ms|mx|mme|m|dr)\.?\s+/i;
function isPerson(cell, person) {

  const words = name.split(/\s+/).filter(Boolean), last = words[words.length - 1] || '', firstI = words.length > 1 ? words[0][0] : '';
  const email = String(person.email || '').toLowerCase(), local = email.split('@')[0];

function dayRec(hr, dk) { const k = (dk || dkey(new Date())) + '|' + hr; return A.days[k] || (A.days[k] = { expected: null, entries: [] }); }
const enrolled = hr => roster(hr).length;
const expectedFor = hr => { const d = dayRec(hr); return d.expected == null ? enrolled(hr) : d.expected; };
function addEntry(hr, e) {
  const d = dayRec(hr);
  e.id = uid(); e.date = dkey(new Date()); e.homeroom = hr; e.t = e.t || hhmm(new Date());
  if (e.expected == null) e.expected = expectedFor(hr);
  d.entries.push(e); saveAtt();
  queue({ op: 'add', id: e.id, date: e.date, time: e.t, homeroom: hr, checkpoint: e.point, count: e.count, expected: e.expected, status: e.status, note: e.note || '' });
  return e;
}
function removeEntry(hr, id) {
  const d = dayRec(hr); const i = d.entries.findIndex(e => e.id === id);
  if (i < 0) return;
  const e = d.entries[i]; d.entries.splice(i, 1);
  if (e.prevExpected !== undefined) d.expected = e.prevExpected;
  saveAtt(); queue({ op: 'delete', id });
}
function seedDemoChecks() {
  if (ui.role === 'Admin') return;
  const hr = myHomeroom(); const d = dayRec(hr); if (d.entries.length) return;
  const n = nowMins(); if (isWeekend() || n < 8 * 60 + 50) return;
  const en = enrolled(hr);
  d.entries.push({ id: uid(), t: '08:47', count: en - 1, point: SA_AM, status: 'safe', expected: en, note: '1 absent at Safe Arrival', prevExpected: null });
  d.expected = en - 1;
  if (n > 11 * 60 + 12) d.entries.push({ id: uid(), t: '11:12', count: en - 1, point: 'After recess / break', status: 'ok', expected: en - 1 });
  saveAtt();
}
function suggestion(hr) {
  const n = nowMins(); const d = dayRec(hr); let best = null;
  (D.bells || []).filter(b => b.checkpoint).forEach(b => {
    const bm = toMins(b.start);
    if (n >= bm - 10 && n <= bm + 25) {
      const done = d.entries.some(e => { const em = toMins(e.t); return e.point === b.checkpoint && em >= bm - 10 && em <= bm + 25; });
      if (!done && (!best || Math.abs(n - bm) < Math.abs(n - best.m))) best = { m: bm, t: b.start, p: b.checkpoint, label: b.label };
    }
  });
  return best;
}

}

function bellNow() {
  const n = nowMins(); const cur = D.bells.find(b => toMins(b.start) <= n && n < (toMins(b.end) || toMins(b.start) + 1));
  const next = D.bells.find(b => toMins(b.start) > n);

}
function dutiesFor(date, mineOnly) {
  const dk = dkey(date);

  const rows = D.duty.filter(r => dayMatches(r.day, date)).map(r => {
    const ch = D.dutyChanges.find(c => c.date === dk && c.location.toLowerCase() === r.location.toLowerCase() && (!c.block || c.block.toLowerCase() === r.block.toLowerCase()));
    return Object.assign({}, r, ch ? { staff: ch.coveredBy || r.staff, covering: ch.replacing || r.staff, note: ch.note } : {});
  });
  return mineOnly ? rows.filter(r => isMe(r.staff)) : rows;
}

function timeline(items, weekend) {

  }).join('') + '</ul>';

function viewWeek() {

    d.expected = Math.max(0, prev + delta);
    addEntry(hr, { count: d.expected, point: 'Count change', status: 'adjust', note: a + ': expected ' + prev + ' → ' + d.expected, expected: prev, prevExpected: prev });
    ui.adjOpen = null; ui.count = null; toast('Expected count is now ' + d.expected); render();
  },
  confirm: () => {
    const hr = myHomeroom(), c = ui.count, ex = expectedFor(hr), pt = ui.point, d = dayRec(hr);
    if (pt === SA_AM || pt === SA_PM) {
      const prev = d.expected; const en = enrolled(hr);
      const e = addEntry(hr, { count: c, point: pt, status: 'safe', expected: pt === SA_AM ? en : ex, prevExpected: prev, note: pt === SA_AM && en - c > 0 ? (en - c) + ' absent at Safe Arrival' : (pt === SA_PM && c !== ex ? 'Afternoon count ' + c + ' (was ' + ex + ')' : '') });
      d.expected = c; saveAtt(); resetCheck(); render();
      toast(c + ' recorded – this is now the expected count', () => removeEntry(hr, e.id)); return;
    }
    if (c === ex) { const e = addEntry(hr, { count: c, point: pt, status: 'ok' }); resetCheck(); render(); toast(c + ' of ' + ex + ' confirmed at ' + nice(e.t), () => removeEntry(hr, e.id)); return; }
    ui.disc = { count: c, expected: ex, t: hhmm(new Date()) }; render();
    const el = document.getElementById('disc'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  recountOk: () => { const hr = myHomeroom(), Dd = ui.disc; const e = addEntry(hr, { count: Dd.expected, point: ui.point, status: 'ok', note: 'Reconfirmed on recount' }); resetCheck(); render(); toast(Dd.expected + ' confirmed on recount', () => removeEntry(hr, e.id)); },
  recountEdit: () => { ui.disc = null; render(); },
  temp: a => { const hr = myHomeroom(), Dd = ui.disc, dd = Dd.expected - Dd.count; addEntry(hr, { t: Dd.t, count: Dd.count, point: ui.point, status: 'resolved', expected: Dd.expected, note: a + ' (' + (dd > 0 ? dd + ' out' : Math.abs(dd) + ' extra') + ')' }); resetCheck(); render(); toast('Logged: ' + a); },
  perm: a => { const hr = myHomeroom(), Dd = ui.disc, d = dayRec(hr), prev = d.expected; addEntry(hr, { t: Dd.t, count: Dd.count, point: ui.point, status: 'resolved', expected: Dd.expected, note: a + ': expected ' + Dd.expected + ' → ' + Dd.count, prevExpected: prev }); d.expected = Dd.count; saveAtt(); resetCheck(); render(); toast('Expected count is now ' + Dd.count); },
  escalate: () => { const hr = myHomeroom(), Dd = ui.disc; addEntry(hr, { t: Dd.t, count: Dd.count, point: ui.point, status: 'escalated', expected: Dd.expected, note: 'Unexplained: counted ' + Dd.count + ', expected ' + Dd.expected + '. Office notified.' }); ui.alarm = true; ui.disc = null; render(); window.scrollTo(0, 0); },
  located: () => { const hr = myHomeroom(); const ex = expectedFor(hr); addEntry(hr, { count: ex, point: 'Student located', status: 'located', note: 'Student located; count back to ' + ex }); ui.alarm = false; render(); toast('Recorded – the office board is updated'); },
  del: a => { removeEntry(myHomeroom(), a); render(); toast('Check deleted'); },
  wk: a => { const n = ui.weekOffset + (+a); if (n <= 0) { ui.weekOffset = n; render(); } },
  print: () => { try { window.print(); } catch (e) {} },
  copyWeek: () => {
    const txt = weekText(), box = document.getElementById('copybox');
    const fallback = () => { box.hidden = false; box.value = txt; box.focus(); box.select(); toast('Text selected – copy it with your keyboard'); };
    try { navigator.clipboard.writeText(txt).then(() => toast('Week copied'), fallback); } catch (e) { fallback(); }
  },
  dutyDay: a => { ui.dutyDay = a; render(); },
  lookup: a => { ui.lookup = a; ui.q = ''; render(); const q = document.getElementById('q'); if (q && a !== 'classes') q.focus(); },
  openClass: a => { ui.tab = 'lookup'; prefs.tab = 'lookup'; savePrefs(); ui.cls = a; ui.clsView = 'roster'; render(); window.scrollTo(0, 0); },
  closeClass: () => { ui.cls = null; render(); },
  clsView: a => { ui.clsView = a; render(); },
  clsDay: a => { ui.clsDay = a; render(); },
  checkClass: a => { prefs.hr = a; savePrefs(); ui.tab = 'check'; ui.checkView = 'class'; ui.cls = null; resetCheck(); render(); window.scrollTo(0, 0); },
  toolsClass: a => { prefs.toolSrc = a; savePrefs(); ui.tab = 'tools'; ui.cls = null; ui.wheelOut = []; ui.winner = null; ui.groups = null; ui.absent = {}; render(); window.scrollTo(0, 0); },
  tool: a => { ui.tool = a; render(); },
  spin: () => { ensureAudio(); spin(); },
  removeWinner: () => { if (ui.winner) ui.wheelOut.push(ui.winner); ui.winner = null; render(); },
  resetWheel: () => { ui.wheelOut = []; ui.winner = null; render(); },
  preset: a => { if (timer.running) return; timer.total = timer.remaining = (+a) * 60000; timer.done = false; render(); },
  nudge: a => {
    const ms = (+a) * 1000;
    if (timer.running) { timer.endAt = Math.max(Date.now() + 1000, timer.endAt + ms); timer.total = Math.max(timer.total, timer.endAt - Date.now()); }
    else { timer.remaining = Math.max(10000, timer.remaining + ms); timer.total = Math.max(timer.remaining, timer.done ? timer.remaining : timer.total + ms); timer.done = false; }
    tick(); render();
  },
  timerGo: () => {
    ensureAudio();
    if (timer.running) { timer.running = false; timer.remaining = Math.max(0, timer.endAt - Date.now()); clearInterval(timer.iv); releaseWake(); }
    else { if (timer.remaining <= 0) timer.remaining = timer.total; timer.done = false; timer.running = true; timer.endAt = Date.now() + timer.remaining; timer.iv = setInterval(tick, 250); holdWake(); }
    render();
  },
  timerReset: () => { timer.running = false; clearInterval(timer.iv); timer.remaining = timer.total; timer.done = false; releaseWake(); render(); },
  absent: a => { ui.absent[a] = !ui.absent[a]; ui.groups = null; render(); },
  groupMode: a => { ui.groupMode = a; ui.groupN = a === 'count' ? 4 : 3; ui.groups = null; render(); },
  groupN: a => { ui.groupN = Math.max(2, Math.min(12, ui.groupN + (+a))); ui.groups = null; render(); },
  makeGroups: () => {
    const names = toolNames().filter(n => !ui.absent[n]);
    for (let i = names.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [names[i], names[j]] = [names[j], names[i]]; }
    const k = Math.max(1, Math.min(names.length, ui.groupMode === 'count' ? ui.groupN : Math.ceil(names.length / ui.groupN)));
    const g = Array.from({ length: k }, () => []); names.forEach((n, i) => g[i % k].push(n)); ui.groups = g; render();
  }
};
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = ACTIONS[b.dataset.act]; if (fn) fn(b.dataset.arg);
});
app.addEventListener('change', e => {
  const k = e.target.dataset.change; if (!k) return;
  if (k === 'hr') { prefs.hr = e.target.value; savePrefs(); resetCheck(); ui.week = null; render(); }
  if (k === 'dutyMine') { prefs.dutyMine = e.target.checked; savePrefs(); render(); }
  if (k === 'toolSrc') { prefs.toolSrc = e.target.value; savePrefs(); ui.wheelOut = []; ui.winner = null; ui.groups = null; ui.absent = {}; render(); }
});
app.addEventListener('input', e => {
  const k = e.target.dataset.input; if (!k) return;
  if (k === 'q') { ui.q = e.target.value; const r = document.getElementById('results'); if (r) r.innerHTML = lookupResults(); }
  if (k === 'custom') { prefs.custom = e.target.value; savePrefs(); ui.wheelOut = []; ui.groups = null; if (ui.tool === 'wheel') { drawWheel(); } }
});
app.addEventListener('focusout', e => { if (e.target.dataset.input === 'custom') render(); });

/* keep "now" markers, due checks and the office board fresh */
setInterval(() => {
  if (spinning || timer.running) return;
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  if (ui.disc || ui.alarm) return;
  if (ui.tab === 'home' || ui.tab === 'duty' || (ui.tab === 'check' && ui.checkView !== 'week')) render();
}, 60000);
/* prune attendance kept on this device after 10 weeks */
(() => { const cut = new Date(); cut.setDate(cut.getDate() - 70); const ck = dkey(cut); Object.keys(A.days).forEach(k => { if (k.slice(0, 10) < ck) delete A.days[k]; }); saveAtt(); })();
/* installed app: passthrough service worker, same as the DIAC Hub */
try { if (!FRAMED && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}

if (DEMO || session) loadData(); else render();
})();
</script>
